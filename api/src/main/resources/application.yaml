spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

  flyway:
    enabled: true

jwt:
  auth-url: ${JWT_AUTH_URL}
  keys-endpoint: ${JWT_KEYS_ENDPOINT}
  connect-timeout: ${JWT_AUTH_CONNECT_TIMEOUT:2s}
  read-timeout: ${JWT_AUTH_READ_TIMEOUT:3s}

analytics:
  refresh-delay: 300000

recommendation:
  fallback-delay: 900000

notification:
  notification-exchange-name: notification.events
