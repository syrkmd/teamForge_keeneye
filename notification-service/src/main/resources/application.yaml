server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

notification:
  notification-exchange-name: notification.events
  notification-queue-name: notification.service.queue
  dlx-exchange-name: notification.events.dlx
  dlq-queue-name: notification.service.queue.dlq
  routing-key: notification.#

jwt:
  auth-url: ${JWT_AUTH_URL}
  keys-endpoint: ${JWT_KEYS_ENDPOINT}
  connect-timeout: ${JWT_AUTH_CONNECT_TIMEOUT:2s}
  read-timeout: ${JWT_AUTH_READ_TIMEOUT:3s}

sse:
  timeout: 1800000
  ticket-ttl: 30000
  ticket-cleanup-interval: 60000